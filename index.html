<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    
    <!-- App Theme Colors -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Primary Meta Tags -->
    <title>NoteToExam — Your AI Study Companion</title>
    <meta name="title" content="NoteToExam — Your AI Study Companion" />
    <meta name="description" content="The ultimate study app for African students. Instantly turn your lecture notes, PDFs, and photos into AI summaries, 60 practice questions, and timed CBT simulators. Pass your exams with ease." />
    <meta name="keywords" content="NoteToExam, exam prep, CBT simulator, study notes, African students, AI tutor, JAMB, WAEC, university past questions" />
    <meta name="author" content="PrimeWebDesigns" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://notetoexam.pages.dev/" />
    <meta property="og:title" content="NoteToExam — Your AI Study Companion" />
    <meta property="og:description" content="Turn your lecture notes into exam-ready summaries, 60 practice questions, and a voice AI tutor. Built for African campuses." />
    <meta property="og:image" content="/images/hero-notebook.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://notetoexam.pages.dev/" />
    <meta property="twitter:title" content="NoteToExam — Your AI Study Companion" />
    <meta property="twitter:description" content="Turn your lecture notes into exam-ready summaries, 60 practice questions, and a voice AI tutor. Built for African campuses." />
    <meta property="twitter:image" content="/images/hero-notebook.png" />

    <!-- Fonts & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Custom Global CSS -->
    <style>
      body {
        background-color: #0F172A;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      ::selection {
        background-color: #E07A5F;
        color: #ffffff;
      }
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

      /* --- PREMIUM BOOK LOADER --- */
      #app-loader {
        position: fixed;
        inset: 0;
        background-color: #0F172A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s ease-out;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* 3D Book Container */
      .book-wrapper {
        perspective: 1000px;
        margin-bottom: 32px;
      }
      
      .book {
        position: relative;
        width: 80px;
        height: 110px;
        transform-style: preserve-3d;
        animation: float 2s ease-in-out infinite;
      }

      /* Book Spine/Back Cover */
      .book::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1e293b; /* Dark slate */
        border-radius: 2px 6px 6px 2px;
        box-shadow: inset 4px 0 10px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.4);
        transform: translateZ(-10px);
      }

      /* The Front Cover (flips open) */
      .book-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #E07A5F; /* Terracotta */
        border-radius: 2px 6px 6px 2px;
        transform-origin: left center;
        animation: openCover 3s ease-in-out infinite;
        box-shadow: inset 2px 0 5px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }
      
      /* Gold detailing on the cover */
      .book-cover::before {
        content: 'N/E';
        color: rgba(255,255,255,0.4);
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        border: 1px solid rgba(255,255,255,0.3);
        padding: 2px 4px;
        border-radius: 2px;
      }

      /* The Flipping Pages */
      .book-page {
        position: absolute;
        top: 2px;
        left: 2px;
        width: calc(100% - 4px);
        height: calc(100% - 4px);
        background: #F8F9FA; /* Off-white */
        border-radius: 0 4px 4px 0;
        transform-origin: left center;
        z-index: 1;
      }
      
      .page-1 { animation: flipPage 3s ease-in-out infinite; animation-delay: 0.2s; }
      .page-2 { animation: flipPage 3s ease-in-out infinite; animation-delay: 0.4s; }
      .page-3 { animation: flipPage 3s ease-in-out infinite; animation-delay: 0.6s; }

      /* Loading Text */
      .loader-text {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #E07A5F;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: pulse 1.5s infinite;
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes openCover {
        0%, 20% { transform: rotateY(0deg); }
        50%, 80% { transform: rotateY(-160deg); }
        100% { transform: rotateY(0deg); }
      }

      @keyframes flipPage {
        0%, 25% { transform: rotateY(0deg); }
        50%, 80% { transform: rotateY(-160deg); }
        100% { transform: rotateY(0deg); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <!-- PREMIUM 3D BOOK LOADER -->
    <div id="app-loader">
      <div class="book-wrapper">
        <div class="book">
          <div class="book-page page-3"></div>
          <div class="book-page page-2"></div>
          <div class="book-page page-1"></div>
          <div class="book-cover"></div>
        </div>
      </div>
      <div class="loader-text">Opening your notes...</div>
    </div>

    <!-- APP ROOT -->
    <div id="root"></div>

    <!-- Main Script -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Auto-Hide Splash Screen -->
    <script>
      window.addEventListener('load', function() {
        // Keep the loader visible for at least 2.5 seconds so the animation is seen
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 600);
          }
        }, 2500); 
      });
    </script>
  </body>
</html>
